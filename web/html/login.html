<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="xui-version" content="{{ .cur_ver }}">
    <meta name="renderer" content="webkit">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var dark = false;
            try { dark = localStorage.getItem('dark-mode') === 'true'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <link rel="icon" type="image/x-icon" href="{{ .base_path }}assets/img/favicon.ico?{{ .cur_ver }}">
    <link rel="preload" as="script" href="{{ .base_path }}assets/vue/vue.min.js?{{ .cur_ver }}">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #f6f8fc; }
        html[data-theme="dark"], html[data-theme="dark"] body { background: #040d12; }
        /* The later #app.vb-login rule sets display:flex, which outranks a bare
           [v-cloak] selector and would expose the raw template while Vue loads. */
        #app[v-cloak] { display: none !important; }
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f8fc;
            transition: opacity .25s ease;
        }
        html[data-theme="dark"] #boot-loader { background: #040d12; }
        #boot-loader::after {
            content: "";
            width: 30px;
            height: 30px;
            border: 2px solid rgba(15, 23, 42, .14);
            border-top-color: #5f5af7;
            border-radius: 50%;
            animation: vb-spin .8s linear infinite;
        }
        html[data-theme="dark"] #boot-loader::after {
            border-color: rgba(255, 255, 255, .16);
            border-top-color: #5f5af7;
        }
        #app:not([v-cloak]) ~ #boot-loader {
            opacity: 0;
            pointer-events: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                         'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif, 'Apple Color Emoji',
                         'Segoe UI Emoji', 'Segoe UI Symbol';
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
    <title>{{ .hostname }} - {{ i18n .title}}</title>
</head>
<div id="message"></div>
<style>
    html,
    body {
        background: #f6f8fc;
    }

    html[data-theme="dark"],
    html[data-theme="dark"] body {
        background: #040d12;
    }

    #app.vb-login {
        --vb-primary: #5f5af7;
        --vb-secondary: #0284c7;
        --vb-bg: #f6f8fc;
        --vb-text: #0f172a;
        --vb-text-2: #334155;
        --vb-muted: #64748b;
        --vb-card: rgba(255, 255, 255, .92);
        --vb-soft: rgba(255, 255, 255, .8);
        --vb-border: rgba(15, 23, 42, .1);
        --vb-field: #f8fafc;
        --vb-field-border: #e2e8f0;
        --vb-shadow: 0 25px 70px -15px rgba(95, 90, 247, .2);
        --vb-star-a: rgba(15, 23, 42, .35);
        --vb-star-b: rgba(95, 90, 247, .45);
        --vb-grid-line: rgba(15, 23, 42, .045);
        --vb-orb-opacity: .5;
        --vb-ring-border: rgba(95, 90, 247, .16);
        --vb-ring-border-2: rgba(2, 132, 199, .12);
        --vb-dot-shadow: 0 0 10px 4px rgba(95, 90, 247, .35);
        --vb-ring-scale: 1;

        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--vb-bg);
        color: var(--vb-text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                     'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        transition: background-color .3s ease, color .3s ease;
    }

    #app.vb-login.dark {
        --vb-bg: #040d12;
        --vb-text: #fff;
        --vb-text-2: #e2e8f0;
        --vb-muted: #cbd5e1;
        --vb-card: rgba(12, 16, 36, .9);
        --vb-soft: rgba(255, 255, 255, .05);
        --vb-border: rgba(255, 255, 255, .1);
        --vb-field: rgba(255, 255, 255, .1);
        --vb-field-border: rgba(255, 255, 255, .1);
        --vb-shadow: 0 30px 90px -20px rgba(95, 90, 247, .35);
        --vb-star-a: rgba(255, 255, 255, .8);
        --vb-star-b: rgba(103, 232, 249, .8);
        --vb-grid-line: rgba(56, 189, 248, .12);
        --vb-orb-opacity: .75;
        --vb-ring-border: rgba(95, 90, 247, .3);
        --vb-ring-border-2: rgba(34, 211, 238, .2);
        --vb-dot-shadow: 0 0 12px 4px rgba(95, 90, 247, .6);
    }

    .vb-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }

    .vb-topline {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(95, 90, 247, .55), rgba(2, 132, 199, .45), transparent);
        opacity: .8;
    }

    .vb-aurora {
        position: absolute;
        border-radius: 50%;
        opacity: var(--vb-orb-opacity);
        filter: blur(90px);
        will-change: transform;
        animation: vb-drift 26s ease-in-out infinite alternate;
    }

    .vb-aurora-a {
        top: -200px;
        left: -180px;
        width: 560px;
        height: 560px;
        background: radial-gradient(circle at 35% 35%, rgba(95, 90, 247, .55), rgba(79, 70, 229, .35) 45%, transparent 70%);
        animation-duration: 24s;
    }

    .vb-aurora-b {
        right: -220px;
        bottom: -240px;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle at 60% 60%, rgba(34, 211, 238, .45), rgba(2, 132, 199, .28) 45%, transparent 70%);
        animation-duration: 30s;
        animation-delay: -8s;
    }

    .vb-aurora-c {
        top: -120px;
        right: -120px;
        width: 420px;
        height: 420px;
        background: radial-gradient(circle at 40% 40%, rgba(168, 85, 247, .38), rgba(95, 90, 247, .25) 50%, transparent 72%);
        animation-duration: 22s;
        animation-delay: -4s;
    }

    .vb-aurora-d {
        bottom: -180px;
        left: -160px;
        width: 460px;
        height: 460px;
        background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, .36), rgba(95, 90, 247, .18) 50%, transparent 72%);
        animation-duration: 28s;
        animation-delay: -12s;
    }

    .vb-grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(to right, var(--vb-grid-line) 1px, transparent 1px),
            linear-gradient(var(--vb-grid-line) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, rgba(0, 0, 0, .55) 45%, transparent 78%);
        mask-image: radial-gradient(circle at 50% 45%, #000 0%, rgba(0, 0, 0, .55) 45%, transparent 78%);
    }

    .vb-stars {
        position: absolute;
        inset: 0;
        background-repeat: no-repeat;
        background-size: cover;
        animation: vb-twinkle 6.5s ease-in-out infinite alternate;
    }

    .vb-stars-a {
        background-image:
            radial-gradient(1.5px 1.5px at 6% 14%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 13% 33%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 21% 8%, var(--vb-star-b) 50%, transparent 51%),
            radial-gradient(1px 1px at 27% 52%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 33% 21%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 39% 73%, var(--vb-star-b) 50%, transparent 51%),
            radial-gradient(1px 1px at 46% 12%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 52% 38%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 58% 82%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 64% 26%, var(--vb-star-b) 50%, transparent 51%),
            radial-gradient(1px 1px at 71% 58%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 77% 17%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 83% 68%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 89% 31%, var(--vb-star-b) 50%, transparent 51%),
            radial-gradient(1px 1px at 94% 77%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 9% 88%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 43% 94%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 68% 91%, var(--vb-star-a) 50%, transparent 51%);
    }

    .vb-stars-b {
        opacity: .75;
        animation-duration: 9s;
        animation-delay: -3s;
        background-image:
            radial-gradient(1px 1px at 4% 44%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 17% 67%, var(--vb-star-b) 50%, transparent 51%),
            radial-gradient(1px 1px at 24% 86%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 31% 39%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 37% 62%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 44% 27%, var(--vb-star-b) 50%, transparent 51%),
            radial-gradient(1px 1px at 49% 84%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 56% 9%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 62% 55%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 69% 76%, var(--vb-star-b) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 74% 43%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 81% 89%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1px 1px at 86% 12%, var(--vb-star-a) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 92% 52%, var(--vb-star-b) 50%, transparent 51%),
            radial-gradient(1px 1px at 97% 24%, var(--vb-star-a) 50%, transparent 51%);
    }

    .vb-rings {
        position: absolute;
        top: 48%;
        left: 50%;
        width: 760px;
        height: 760px;
        margin: -380px 0 0 -380px;
        transform: scale(1);
        transform-origin: center;
    }

    .vb-ring,
    .vb-orbit {
        position: absolute;
        border-radius: 50%;
    }

    .vb-ring {
        border: 1px solid var(--vb-ring-border);
    }

    .vb-ring-1 {
        inset: 0;
    }

    .vb-ring-2 {
        inset: 120px;
        border-color: var(--vb-ring-border-2);
    }

    .vb-orbit {
        animation: vb-rotate linear infinite;
    }

    .vb-orbit i {
        position: absolute;
        top: -4px;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: var(--vb-primary);
        box-shadow: var(--vb-dot-shadow);
    }

    .vb-orbit-1 {
        inset: 0;
        animation-duration: 34s;
        animation-delay: -6s;
    }

    .vb-orbit-2 {
        inset: 120px;
        animation-duration: 22s;
        animation-direction: reverse;
        animation-delay: -11s;
    }

    .vb-orbit-2 i {
        background: #22d3ee;
    }

    .vb-orbit-3 {
        inset: 60px;
        animation-duration: 46s;
        animation-delay: -19s;
    }

    .vb-orbit-3 i {
        top: -2.5px;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
    }

    .vb-orbit-4 {
        inset: 180px;
        animation-duration: 18s;
        animation-direction: reverse;
        animation-delay: -4s;
    }

    .vb-orbit-4 i {
        top: -3px;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        background: #a855f7;
    }

    .vb-orbit-5 {
        inset: 240px;
        animation-duration: 28s;
        animation-delay: -14s;
    }

    .vb-orbit-5 i {
        top: -2.5px;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        background: #38bdf8;
    }

    .vb-icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 1px solid var(--vb-border);
        border-radius: 50%;
        background: var(--vb-soft);
        color: var(--vb-text);
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
        transition: background-color .2s, transform .15s;
    }

    .vb-icon-btn:hover {
        transform: scale(1.05);
        background: rgba(95, 90, 247, .12);
    }

    .vb-icon-btn svg {
        width: 18px;
        height: 18px;
    }

    .vb-icon-btn .vb-sun {
        color: #f59e0b;
    }

    .vb-main {
        position: relative;
        z-index: 20;
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px;
    }

    .vb-card {
        position: relative;
        display: grid;
        grid-template-columns: 1fr;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--vb-border);
        border-radius: 24px;
        background: var(--vb-card);
        box-shadow: var(--vb-shadow);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
        animation: vb-rise .45s cubic-bezier(.22, .8, .35, 1) both;
    }

    .vb-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        padding: 1px;
        border-radius: inherit;
        background: linear-gradient(115deg, rgba(95, 90, 247, .55), rgba(2, 132, 199, .15) 35%, transparent 55%, rgba(95, 90, 247, .3) 85%);
        background-size: 200% 200%;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        pointer-events: none;
        animation: vb-glow 9s ease-in-out infinite;
    }

    .vb-form-panel {
        position: relative;
        z-index: 1;
        min-width: 0;
        padding: 32px;
    }

    .vb-label {
        display: block;
        margin: 0 0 8px;
        color: var(--vb-text-2);
        font-size: 14px;
        font-weight: 500;
    }

    .vb-field {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
        padding: 12px;
        border: 1px solid var(--vb-field-border);
        border-radius: 8px;
        background: var(--vb-field);
        transition: border-color .2s, box-shadow .2s;
    }

    .vb-field:focus-within {
        border-color: rgba(95, 90, 247, .5);
        box-shadow: 0 0 0 3px rgba(95, 90, 247, .18);
    }

    .vb-field-icon {
        flex: none;
        width: 16px;
        height: 16px;
        margin-right: 8px;
        color: var(--vb-muted);
    }

    .vb-field input {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--vb-text);
        font-family: inherit;
        font-size: 16px;
    }

    .vb-field input::placeholder {
        color: var(--vb-muted);
        opacity: .75;
    }

    .vb-eye {
        display: flex;
        flex: none;
        align-items: center;
        padding: 0 0 0 8px;
        border: 0;
        background: transparent;
        color: var(--vb-muted);
        cursor: pointer;
    }

    .vb-eye:hover {
        color: var(--vb-text);
    }

    .vb-eye svg {
        width: 17px;
        height: 17px;
    }

    .vb-lang-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 20px;
    }

    .vb-lang-row .vb-icon-btn {
        width: 32px;
        height: 32px;
        box-shadow: none;
    }

    .vb-lang-row .vb-icon-btn svg {
        width: 16px;
        height: 16px;
    }

    .vb-lang-switch {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--vb-field-border);
        border-radius: 999px;
        background: var(--vb-field);
    }

    .vb-lang-switch button {
        padding: 4px 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--vb-muted);
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color .2s, color .2s;
    }

    .vb-lang-switch button.on {
        background: rgba(95, 90, 247, .16);
        color: var(--vb-text);
    }

    .vb-submit {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        margin-top: 8px;
        padding: 12px 0;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--vb-primary), var(--vb-secondary));
        box-shadow: 0 4px 8px -2px rgba(0, 0, 0, .2);
        color: #fff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity .2s, box-shadow .2s, transform .1s;
    }

    .vb-submit:hover:not(:disabled) {
        opacity: .93;
        box-shadow: 0 10px 24px -8px rgba(95, 90, 247, .55);
    }

    .vb-submit:active:not(:disabled) {
        transform: translateY(1px);
    }

    .vb-submit:disabled {
        cursor: default;
        opacity: .8;
    }

    .vb-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, .35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: vb-spin .7s linear infinite;
    }

    .vb-error {
        margin: -4px 0 12px;
        color: #dc2626;
        font-size: 13px;
        line-height: 1.4;
    }

    #app.vb-login.dark .vb-error {
        color: #fca5a5;
    }

    @media (min-width: 420px) {
        .vb-main {
            padding: 24px;
        }
    }

    @media (min-width: 640px) {
        .vb-main {
            padding: 32px;
        }
    }

    @media (min-width: 768px) {
        .vb-form-panel {
            padding: 40px;
        }
    }

    @media (min-width: 1024px) {
        .vb-form-panel {
            padding: 48px;
        }
    }

    @media (max-width: 1100px) {
        .vb-rings {
            transform: scale(.8);
        }
    }

    @media (max-width: 768px) {
        .vb-rings {
            transform: scale(.6);
        }

        .vb-aurora {
            filter: blur(64px);
        }

        .vb-aurora-c,
        .vb-aurora-d {
            display: none;
        }
    }

    @media (max-width: 480px) {
        .vb-rings {
            transform: scale(.44);
        }
    }

    @keyframes vb-rise {
        from {
            opacity: 0;
            transform: translateY(14px);
        }

        to {
            opacity: 1;
            transform: none;
        }
    }

    @keyframes vb-glow {
        0%, 100% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }
    }

    @keyframes vb-drift {
        0% {
            transform: translate3d(0, 0, 0) scale(1);
        }

        50% {
            transform: translate3d(34px, -26px, 0) scale(1.06);
        }

        100% {
            transform: translate3d(-28px, 22px, 0) scale(.97);
        }
    }

    @keyframes vb-twinkle {
        0%, 100% {
            opacity: .35;
        }

        50% {
            opacity: .9;
        }
    }

    @keyframes vb-rotate {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes vb-spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* Only one-shot decoration is suppressed; the drifting background is the
       intended look and must not vanish when Windows "animation effects" is off. */
    @media (prefers-reduced-motion: reduce) {
        .vb-card,
        .vb-card::before {
            animation: none;
        }
    }
</style>
<body>
<div id="app" class="vb-login" :class="themeSwitcher.currentTheme" v-cloak>
    <div class="vb-bg" aria-hidden="true">
        <div class="vb-aurora vb-aurora-a"></div>
        <div class="vb-aurora vb-aurora-b"></div>
        <div class="vb-aurora vb-aurora-c"></div>
        <div class="vb-aurora vb-aurora-d"></div>
        <div class="vb-grid"></div>
        <div class="vb-stars vb-stars-a"></div>
        <div class="vb-stars vb-stars-b"></div>
        <div class="vb-rings">
            <div class="vb-ring vb-ring-1"></div>
            <div class="vb-ring vb-ring-2"></div>
            <div class="vb-orbit vb-orbit-1"><i></i></div>
            <div class="vb-orbit vb-orbit-2"><i></i></div>
            <div class="vb-orbit vb-orbit-3"><i></i></div>
            <div class="vb-orbit vb-orbit-4"><i></i></div>
            <div class="vb-orbit vb-orbit-5"><i></i></div>
        </div>
        <div class="vb-topline"></div>
    </div>
    <main class="vb-main">
        <div class="vb-card">
            <section class="vb-form-panel">
                <form @submit.prevent="login">
                    <label class="vb-label" for="vb-username">{{ i18n "username" }}</label>
                    <div class="vb-field">
                        <svg class="vb-field-icon" fill="none" stroke="currentColor" stroke-width="2"
                             viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input id="vb-username" v-model.trim="user.username" type="text" autocomplete="username"
                               autofocus placeholder='{{ i18n "username" }}'>
                    </div>

                    <label class="vb-label" for="vb-password">{{ i18n "password" }}</label>
                    <div class="vb-field">
                        <svg class="vb-field-icon" fill="none" stroke="currentColor" stroke-width="2"
                             viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="10" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        </svg>
                        <input id="vb-password" v-model.trim="user.password"
                               :type="showPassword ? 'text' : 'password'"
                               autocomplete="current-password" placeholder='{{ i18n "password" }}'>
                        <button type="button" class="vb-eye" @click="showPassword = !showPassword" tabindex="-1"
                                aria-label="toggle password">
                            <svg v-if="showPassword" fill="none" stroke="currentColor" stroke-width="1.8"
                                 viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/>
                                <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.1 4.1M6.2 6.2A18.4 18.4 0 0 0 2 12s3.5 7 10 7c1 0 2-.2 2.9-.5"/>
                            </svg>
                            <svg v-else fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <div class="vb-lang-row">
                        <button type="button" class="vb-icon-btn" @click="themeSwitcher.toggleTheme()"
                                title="{{ i18n "pages.login.toggleTheme" }}">
                            <svg v-if="themeSwitcher.isDarkTheme" class="vb-sun" fill="none" stroke="currentColor"
                                 stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                            </svg>
                            <svg v-else fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                            </svg>
                        </button>
                        <div class="vb-lang-switch" role="group"
                             aria-label="{{ i18n "pages.login.langLabel" }}">
                            <button type="button" :class="{on: lang === 'zh-Hans'}"
                                    @click="switchLang('zh-Hans')">中文</button>
                            <button type="button" :class="{on: lang === 'en-US'}"
                                    @click="switchLang('en-US')">English</button>
                        </div>
                    </div>

                    <template v-if="error">
                        <div class="vb-error" role="alert" v-text="error"></div>
                    </template>

                    <button class="vb-submit" type="submit" :disabled="loading">
                        <span v-if="!loading">{{ i18n "login" }}</span>
                        <span v-else class="vb-spinner"></span>
                    </button>
                </form>
            </section>
        </div>
    </main>
</div>
<div id="boot-loader" aria-hidden="true"></div>
<script src="{{ .base_path }}assets/vue/vue.min.js?{{ .cur_ver }}"></script>
<script>
    const basePath = '{{ .base_path }}';
    const DEFAULT_LANG = 'zh-Hans';

    function isSupportLang(lang) {
        return lang === 'zh-Hans' || lang === 'en-US';
    }

    function getLang() {
        const match = document.cookie.match(/(?:^|;\s*)lang=([^;]+)/);
        let lang = match ? decodeURIComponent(match[1]) : '';
        if (!isSupportLang(lang)) {
            lang = DEFAULT_LANG;
            document.cookie = 'lang=' + lang + ';path=' + basePath;
        }
        return lang;
    }

    function setLang(lang) {
        if (!isSupportLang(lang)) {
            lang = DEFAULT_LANG;
        }
        document.cookie = 'lang=' + lang + ';path=' + basePath;
        window.location.reload();
    }

    function createThemeSwitcher() {
        const isDarkTheme = localStorage.getItem('dark-mode') === 'true';
        const theme = isDarkTheme ? 'dark' : 'light';
        return {
            isDarkTheme,
            get currentTheme() {
                return this.isDarkTheme ? 'dark' : 'light';
            },
            toggleTheme() {
                this.isDarkTheme = !this.isDarkTheme;
                localStorage.setItem('dark-mode', this.isDarkTheme);
                document.getElementById('message').className = themeSwitcher.currentTheme;
            },
        };
    }

    const themeSwitcher = createThemeSwitcher();
    document.getElementById('message').className = themeSwitcher.currentTheme;
</script>
<script>
    class User {
        constructor() {
            this.username = "";
            this.password = "";
        }
    }

    const app = new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            themeSwitcher,
            loading: false,
            showPassword: false,
            user: new User(),
            lang: "",
            error: ""
        },
        created() {
            this.lang = getLang();
        },
        methods: {
            switchLang(lang) {
                if (lang !== this.lang) {
                    setLang(lang);
                }
            },
            async login() {
                if (this.loading) {
                    return;
                }
                this.error = '';
                this.loading = true;
                try {
                    const body = new URLSearchParams();
                    body.set('username', this.user.username);
                    body.set('password', this.user.password);
                    const resp = await fetch(basePath + 'login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body,
                    });
                    const msg = await resp.json();
                    if (msg && msg.success) {
                        location.href = basePath + 'xui/';
                        return;
                    }
                    this.error = (msg && msg.msg) || '登录失败';
                } catch (e) {
                    this.error = e.toString();
                }
                this.loading = false;
            }
        },
    });
</script>
</body>
</html>
